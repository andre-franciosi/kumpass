services:
  postgres:
    image: postgres:16-alpine
    container_name: kumpas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kumpas
      POSTGRES_PASSWORD: kumpas
      POSTGRES_DB: kumpas
    ports:
      - "5432:5432"
    volumes:
      - kumpas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kumpas -d kumpas"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kumpas_pgdata:
